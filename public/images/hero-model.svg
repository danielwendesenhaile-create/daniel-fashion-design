<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="goldLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A15A"/>
      <stop offset="45%" stop-color="#B5883F"/>
      <stop offset="100%" stop-color="#7B2D3B"/>
    </linearGradient>
    <linearGradient id="gownFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A15A" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#C9A15A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A15A" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#C9A15A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A15A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gem" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F3D9DC"/>
      <stop offset="55%" stop-color="#7B2D3B"/>
      <stop offset="100%" stop-color="#5e222c"/>
    </radialGradient>
  </defs>

  <ellipse cx="310" cy="220" rx="230" ry="260" fill="url(#glow)" />

  <!-- floating ribbon / motion lines -->
  <g stroke="url(#goldLine)" stroke-width="1.3" fill="none" opacity="0.5" class="wind-line wind-1">
    <path d="M70,140 C150,120 190,180 150,240 C120,282 160,320 230,300" />
  </g>
  <g stroke="url(#goldLine)" stroke-width="1.1" fill="none" opacity="0.35" class="wind-line wind-2">
    <path d="M60,540 C140,520 165,580 125,635 C102,668 142,700 210,682" />
  </g>
  <g stroke="url(#goldLine)" stroke-width="1" fill="none" opacity="0.3" class="wind-line wind-3">
    <path d="M520,180 C460,198 452,252 498,288 C530,314 508,350 460,346" />
  </g>

  <!-- hanger -->
  <g stroke="url(#goldLine)" stroke-width="2" fill="none" opacity="0.9">
    <line x1="300" y1="60" x2="300" y2="92" />
    <path d="M240,130 C240,100 270,88 300,88 C330,88 360,100 360,130" />
    <circle cx="300" cy="58" r="6" fill="none" />
  </g>

  <!-- gown silhouette: bodice tapering to a full flowing skirt -->
  <path class="gown" d="M244,132
    C238,160 236,190 244,214
    C222,236 200,272 190,320
    C170,410 150,520 132,630
    C122,690 150,740 210,768
    C260,790 350,790 400,766
    C458,738 484,688 472,628
    C452,522 430,410 408,320
    C398,272 376,236 356,214
    C364,190 362,160 356,132
    C338,116 262,116 244,132 Z"
    fill="url(#gownFill)" stroke="url(#goldLine)" stroke-width="1.8" />

  <!-- waist seam -->
  <path d="M226,244 C260,262 340,262 374,244" fill="none" stroke="url(#goldLine)" stroke-width="1.4" opacity="0.75" />

  <!-- decorative waist sash + bow, hugging the waist seam -->
  <path d="M226,244 C260,262 340,262 374,244 L374,254 C340,272 260,272 226,254 Z"
    fill="url(#gownFill)" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.85" />
  <g class="sash-bow" stroke="url(#goldLine)" stroke-width="1.3" fill="url(#gownFill)">
    <path d="M300,262 C289,254 278,255 275,263 C273,270 282,275 292,271 C296,269 299,265 300,262 Z" />
    <path d="M300,262 C311,254 322,255 325,263 C327,270 318,275 308,271 C304,269 301,265 300,262 Z" />
    <circle cx="300" cy="262" r="3.5" fill="url(#gem)" stroke="url(#goldLine)" stroke-width="0.8" />
  </g>

  <!-- neckline brooch -->
  <g class="brooch">
    <path d="M300,150 L306,160 L300,170 L294,160 Z" fill="url(#gem)" stroke="url(#goldLine)" stroke-width="1" />
    <g stroke="#C9A15A" stroke-width="0.8" opacity="0.7">
      <line x1="300" y1="140" x2="300" y2="146" />
      <line x1="300" y1="174" x2="300" y2="180" />
      <line x1="286" y1="160" x2="291" y2="160" />
      <line x1="309" y1="160" x2="314" y2="160" />
    </g>
  </g>

  <!-- bodice center seam + neckline -->
  <path d="M300,134 L300,244" stroke="url(#goldLine)" stroke-width="1.2" opacity="0.6" />
  <path d="M262,128 C278,142 322,142 338,128" fill="none" stroke="url(#goldLine)" stroke-width="1.4" opacity="0.8" />

  <!-- beaded neckline trim -->
  <g fill="#C9A15A" opacity="0.85">
    <circle cx="268" cy="130" r="1.6" />
    <circle cx="280" cy="137" r="1.6" />
    <circle cx="293" cy="141" r="1.6" />
    <circle cx="307" cy="141" r="1.6" />
    <circle cx="320" cy="137" r="1.6" />
    <circle cx="332" cy="130" r="1.6" />
  </g>

  <!-- flowing skirt pleats -->
  <g stroke="url(#goldLine)" stroke-width="1" fill="none" opacity="0.55">
    <path d="M240,270 C210,380 178,510 158,640" />
    <path d="M272,258 C255,380 240,520 232,660" />
    <path d="M300,254 C296,390 296,530 300,672" />
    <path d="M328,258 C345,380 360,520 368,660" />
    <path d="M360,270 C390,380 422,510 442,640" />
  </g>

  <!-- diagonal fabric sheen -->
  <g stroke="#F3D9DC" stroke-width="0.7" opacity="0.4">
    <path d="M210,320 L260,300" />
    <path d="M230,420 L285,398" />
    <path d="M260,540 L318,516" />
    <path d="M340,340 L390,362" />
    <path d="M355,460 L408,484" />
  </g>

  <!-- beading along pleats -->
  <g fill="#7B2D3B" opacity="0.8">
    <circle cx="220" cy="350" r="1.4" /><circle cx="200" cy="430" r="1.4" /><circle cx="184" cy="512" r="1.4" /><circle cx="168" cy="590" r="1.4" />
    <circle cx="262" cy="340" r="1.4" /><circle cx="250" cy="430" r="1.4" /><circle cx="240" cy="520" r="1.4" /><circle cx="235" cy="600" r="1.4" />
    <circle cx="298" cy="340" r="1.4" /><circle cx="296" cy="430" r="1.4" /><circle cx="297" cy="530" r="1.4" /><circle cx="299" cy="610" r="1.4" />
    <circle cx="338" cy="340" r="1.4" /><circle cx="348" cy="430" r="1.4" /><circle cx="360" cy="520" r="1.4" /><circle cx="366" cy="600" r="1.4" />
    <circle cx="380" cy="350" r="1.4" /><circle cx="400" cy="430" r="1.4" /><circle cx="416" cy="512" r="1.4" /><circle cx="432" cy="590" r="1.4" />
  </g>

  <!-- embroidered rosette motifs -->
  <g class="motif" transform="translate(196,472)" opacity="0.85">
    <ellipse cx="0" cy="-4.5" rx="1.6" ry="3" fill="url(#goldLine)" />
    <ellipse cx="0" cy="-4.5" rx="1.6" ry="3" fill="url(#goldLine)" transform="rotate(90)" />
    <ellipse cx="0" cy="-4.5" rx="1.6" ry="3" fill="url(#goldLine)" transform="rotate(180)" />
    <ellipse cx="0" cy="-4.5" rx="1.6" ry="3" fill="url(#goldLine)" transform="rotate(270)" />
    <circle r="1.3" fill="#7B2D3B" />
  </g>
  <g class="motif" transform="translate(412,512)" opacity="0.8">
    <ellipse cx="0" cy="-4" rx="1.4" ry="2.6" fill="#7B2D3B" />
    <ellipse cx="0" cy="-4" rx="1.4" ry="2.6" fill="#7B2D3B" transform="rotate(90)" />
    <ellipse cx="0" cy="-4" rx="1.4" ry="2.6" fill="#7B2D3B" transform="rotate(180)" />
    <ellipse cx="0" cy="-4" rx="1.4" ry="2.6" fill="#7B2D3B" transform="rotate(270)" />
    <circle r="1.1" fill="#C9A15A" />
  </g>
  <g class="motif" transform="translate(258,606)" opacity="0.75">
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" />
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" transform="rotate(90)" />
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" transform="rotate(180)" />
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" transform="rotate(270)" />
    <circle r="1" fill="#7B2D3B" />
  </g>
  <g class="motif" transform="translate(348,634)" opacity="0.75">
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" />
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" transform="rotate(90)" />
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" transform="rotate(180)" />
    <ellipse cx="0" cy="-3.5" rx="1.2" ry="2.2" fill="url(#goldLine)" transform="rotate(270)" />
    <circle r="1" fill="#7B2D3B" />
  </g>

  <!-- hem embellishment: double line + scallop trim -->
  <path d="M150,700 C230,732 370,732 454,700" fill="none" stroke="url(#goldLine)" stroke-width="1.6" opacity="0.85" />
  <path d="M158,714 C232,744 372,744 446,714" fill="none" stroke="url(#goldLine)" stroke-width="1" opacity="0.55" />
  <g stroke="url(#goldLine)" stroke-width="0.9" fill="none" opacity="0.65">
    <path d="M170,722 q9,10 18,0" /><path d="M198,730 q9,10 18,0" /><path d="M226,736 q9,10 18,0" />
    <path d="M254,740 q9,9 18,0" /><path d="M282,742 q9,9 18,0" /><path d="M310,742 q9,9 18,0" />
    <path d="M338,740 q9,9 18,0" /><path d="M366,736 q9,10 18,0" /><path d="M394,730 q9,10 18,0" /><path d="M422,722 q9,10 18,0" />
  </g>

  <!-- sparkle accents -->
  <g fill="#C9A15A" class="sparkle sparkle-1"><circle cx="120" cy="120" r="2.4" /></g>
  <g fill="#7B2D3B" class="sparkle sparkle-2"><circle cx="500" cy="210" r="2" /></g>
  <g fill="#C9A15A" class="sparkle sparkle-3"><circle cx="490" cy="480" r="2.6" /></g>
  <g fill="#7B2D3B" class="sparkle sparkle-4"><circle cx="100" cy="470" r="2.2" /></g>
  <g fill="#C9A15A" class="sparkle sparkle-5"><circle cx="330" cy="200" r="1.8" /></g>
  <g fill="#7B2D3B" class="sparkle sparkle-6"><circle cx="410" cy="740" r="2.2" /></g>
  <g fill="#C9A15A" class="sparkle sparkle-7"><circle cx="170" cy="600" r="1.8" /></g>
  <g fill="#F3D9DC" class="sparkle sparkle-8"><circle cx="440" cy="360" r="2" /></g>
  <g fill="#7B2D3B" class="sparkle sparkle-9"><circle cx="150" cy="260" r="1.6" /></g>

  <style>
    .wind-line { transform-origin: center; animation: drift 9s ease-in-out infinite; }
    .wind-2 { animation-duration: 11s; animation-delay: 0.5s; }
    .wind-3 { animation-duration: 13s; animation-delay: 1s; }
    @keyframes drift {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.35; }
      50% { transform: translateY(-14px) translateX(6px); opacity: 0.6; }
    }
    .gown { animation: sway 8s ease-in-out infinite; transform-origin: 300px 140px; }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1deg); }
    }
    .sparkle { animation: twinkle 3.2s ease-in-out infinite; }
    .sparkle-2 { animation-delay: 0.8s; }
    .sparkle-3 { animation-delay: 1.6s; }
    .sparkle-4 { animation-delay: 2.2s; }
    .sparkle-5 { animation-delay: 0.4s; }
    .sparkle-6 { animation-delay: 1.9s; }
    .sparkle-7 { animation-delay: 1.2s; }
    .sparkle-8 { animation-delay: 2.6s; }
    .sparkle-9 { animation-delay: 0.9s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }
    .brooch { animation: shine 3.6s ease-in-out infinite; transform-origin: 300px 160px; }
    @keyframes shine {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
  </style>
</svg>
